name: Valider une contribution

# Passe sur chaque pull request : c'est le vrai filet de securite du projet.
# Une contribution qui casserait les donnees de traduction est refusee ici,
# avant toute relecture humaine.
#
# Note de securite : ce workflow s'execute avec `pull_request` (et non
# `pull_request_target`) et en lecture seule. Le code d'une contribution
# exterieure ne peut donc ni ecrire dans le depot, ni acceder a un secret.

on:
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - "*.py"

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Les fichiers de donnees sont du JSON valide
        run: |
          for f in data/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::JSON invalide"; exit 1; }
            echo "  ok  $f"
          done

      - name: Les donnees de traduction sont coherentes
        run: python3 tools/valider_donnees.py

      - name: Aucun binaire ni fichier volumineux ajoute
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # les binaires n'ont rien a faire dans un depot de traduction, et
          # certains (Oodle) ne sont pas redistribuables
          ajouts=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD)
          echec=0
          for f in $ajouts; do
            case "$f" in
              *.so|*.dll|*.exe|*.pak|*.locres|*.zip|*.tar.gz)
                echo "::error file=$f::binaire non accepte"; echec=1;;
            esac
            if [ -f "$f" ] && [ "$(stat -c%s "$f")" -gt 5242880 ]; then
              echo "::error file=$f::fichier de plus de 5 Mo"; echec=1
            fi
          done
          exit $echec
